<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>R46H 串流手柄测试</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#111a24;color:#f1f6fa}*{box-sizing:border-box}body{max-width:1000px;margin:0 auto;padding:20px}header{display:flex;gap:16px;align-items:center;justify-content:space-between}h1{font-size:25px;margin:0 0 6px}p{margin:5px 0;color:#afc1cc;font-size:14px}button,select{font:inherit;font-size:14px;background:#243b43;color:#f1f6fa;border:1px solid #40535f;border-radius:8px;padding:9px 12px}button:focus-visible,select:focus-visible{outline:2px solid #99efdb;outline-offset:3px}nav{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 8px}select{min-width:240px;max-width:100%;flex:1}#status{color:#99efdb}canvas{display:block;width:100%;height:auto;background:#111a24;border:1px solid #40535f;border-radius:12px}footer{padding-top:10px}#device{overflow-wrap:anywhere}@media(max-width:600px){body{padding:10px}header{display:block}}
</style>
<header><div><h1>R46H 串流手柄测试</h1><p>左摇杆移动方块 · 右摇杆移动光标 · A 改变方块颜色</p></div><div id="status" role="status">等待真实手柄</div></header>
<p id="device">请按一下掌机 A，允许浏览器发现手柄。</p>
<nav><select id="pads" aria-label="选择 Sunshine 虚拟手柄"><option value="">尚未发现手柄</option></select><button id="reset">清除记录</button><button id="export">导出记录</button></nav>
<canvas id="screen" width="960" height="600" aria-label="摇杆、扳机、按钮及可移动方块的实时反馈"></canvas>
<footer><p>输入来自电脑浏览器的 Gamepad API；测试页不会生成虚拟输入。L1、R1 请分别测试，最后同时按下退出串流。</p><p id="summary">尚未收到输入变化</p></footer>
<script>
'use strict';
const clamp=(v,lo,hi)=>Number.isFinite(v)?Math.max(lo,Math.min(hi,v)):0;
function snapshot(p){
 if(!p||p.connected===false)return null;
 return {index:p.index,id:String(p.id||'未知手柄').slice(0,160),standard:p.mapping==='standard',
  axes:Array.from({length:4},(_,i)=>clamp(Number(p.axes?.[i]??0),-1,1)),
  buttons:Array.from(p.buttons||[]).slice(0,32).map(b=>({value:clamp(Number(typeof b==='number'?b:b?.value),0,1),pressed:typeof b==='number'?b>.5:!!b?.pressed}))};
}
function move(pos,s,dt){
 if(!s)return pos;
 const axis=v=>Math.abs(v)<.1?0:v;
 const dx=axis(s.axes[0])+(s.standard?Number(s.buttons[15]?.pressed||false)-Number(s.buttons[14]?.pressed||false):0);
 const dy=axis(s.axes[1])+(s.standard?Number(s.buttons[13]?.pressed||false)-Number(s.buttons[12]?.pressed||false):0);
 const step=220*clamp(dt,0,.05);
 return {x:clamp(pos.x+dx*step,522,914),y:clamp(pos.y+dy*step,90,275)};
}
function selfTest(){
 const check=(v)=>{if(!v)throw Error('INPUT_TEST_LOGIC_FAILURE')};
 check(snapshot(null)===null);check(snapshot({connected:false})===null);
 const s=snapshot({index:0,id:'test',mapping:'standard',axes:[-2,2,NaN,0.25],buttons:[{value:2,pressed:true},0]});
 check(JSON.stringify(s.axes)==='[-1,1,0,0.25]');check(s.buttons[0].value===1&&s.buttons[0].pressed&&!s.buttons[1].pressed);
 check(move({x:522,y:275},s,10).x===522);check(move({x:600,y:150},null,1).x===600);
 const neutral=snapshot({axes:[],buttons:[]});check(move({x:600,y:150},neutral,.02).x===600);
 return true;
}
selfTest();
// UI runtime
const $=id=>document.getElementById(id),canvas=$('screen'),ctx=canvas.getContext('2d');
const labels=['A','B','X','Y','L1','R1','L2','R2','SELECT','START','L3','R3','↑','↓','←','→','GUIDE'];
let selected=null,seen=false,lastIdentity='',lastSnapshot=null,lastSignature='',changes=0,pressed=new Set(),ranges=Array.from({length:4},()=>[0,0]);
let position={x:720,y:180},previous=performance.now(),latest=null,lastDeviceList='',lost=false,started=new Date().toISOString();
function reset(){seen=false;lastSignature='';changes=0;pressed.clear();ranges=Array.from({length:4},()=>[0,0]);position={x:720,y:180};started=new Date().toISOString()}
$('reset').onclick=reset;
$('pads').onchange=()=>{selected=$('pads').value===''?null:Number($('pads').value);lastIdentity='';lost=false;reset()};
$('export').onclick=()=>{
 const report={version:1,started,source:'browser-gamepad-api',gamepad:latest||lastSnapshot,connected:!!latest,changes,pressedButtons:[...pressed].sort((a,b)=>a-b),axisRanges:ranges,
  boundary:'Host input observation only. Operator must verify the selected device is Sunshine and watch/hear the handheld. Not an end-to-end latency or rumble test.'};
 const url=URL.createObjectURL(new Blob([JSON.stringify(report,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='r46h-input-test.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
};
function text(t,x,y,size=18,color='#afc1cc'){ctx.fillStyle=color;ctx.font=`${size}px system-ui`;ctx.fillText(t,x,y)}
function box(x,y,w,h,color='#1c2934'){ctx.fillStyle=color;ctx.fillRect(x,y,w,h)}
function stick(s,start,x,y,name){
 text(name,x-84,y-100,20,'#f1f6fa');ctx.strokeStyle='#40535f';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,70,0,Math.PI*2);ctx.moveTo(x-70,y);ctx.lineTo(x+70,y);ctx.moveTo(x,y-70);ctx.lineTo(x,y+70);ctx.stroke();
 const a=s?.axes[start]||0,b=s?.axes[start+1]||0;ctx.fillStyle=s?'#99efdb':'#40535f';ctx.beginPath();ctx.arc(x+a*62,y+b*62,10,0,Math.PI*2);ctx.fill();text(`X ${a.toFixed(3)}  Y ${b.toFixed(3)}`,x-93,y+102,16);
}
function draw(s){
 const height=s?.buttons.length>24?630:600;if(canvas.height!==height)canvas.height=height;
 ctx.clearRect(0,0,960,canvas.height);stick(s,0,130,170,s&&!s.standard?'轴 1 / 2':'左摇杆');stick(s,2,360,170,s&&!s.standard?'轴 3 / 4':'右摇杆');
 text('控制反馈',512,40,20,'#f1f6fa');box(502,64,432,240);box(position.x-12,position.y-12,24,24,s?.buttons[0]?.pressed?'#f5d68a':'#99efdb');
 if(s){ctx.strokeStyle='#f5d68a';ctx.beginPath();ctx.arc(718+s.axes[2]*185,184+s.axes[3]*98,12,0,Math.PI*2);ctx.stroke()}
 for(let i=0;i<2;i++){const v=s?.standard?s.buttons[6+i]?.value||0:0;box(26+i*230,311,192,10,'#40535f');box(26+i*230,311,192*v,10,'#99efdb');text(`${i?'R2':'L2'}  ${v.toFixed(2)}`,26+i*230,350,17)}
 text('按钮反馈 · 亮色为当前按下，圆点为曾经按下',26,389,18,'#f1f6fa');
 const buttons=s?.buttons||Array.from({length:17},()=>({pressed:false,value:0}));
 buttons.forEach((b,i)=>{const x=26+i%8*114,y=408+Math.floor(i/8)*52;box(x,y,103,42,b.pressed?'#99efdb':'#1c2934');text(s?.standard?labels[i]||`#${i}`:`#${i}`,x+9,y+28,17,b.pressed?'#173a35':'#afc1cc');if(pressed.has(i)){ctx.fillStyle=b.pressed?'#173a35':'#99efdb';ctx.beginPath();ctx.arc(x+92,y+8,3,0,7);ctx.fill()}});
}
function frame(now){
 const dt=(now-previous)/1000;previous=now;let pads=[],accessError='';
 try{if(!navigator.getGamepads)accessError='浏览器未提供 Gamepad API';else pads=Array.from(navigator.getGamepads()).filter(p=>p&&p.connected)}catch(e){accessError='浏览器未允许手柄访问'}
 const list=JSON.stringify(pads.map(p=>[p.index,p.id]));
 if(list!==lastDeviceList){lastDeviceList=list;$('pads').replaceChildren();if((selected===null&&pads.length!==1)||(selected!==null&&!pads.some(p=>p.index===selected))){const o=document.createElement('option');o.textContent=pads.length?'请选择正确的虚拟手柄':'尚未发现手柄';o.value='';$('pads').append(o)}
  pads.forEach(p=>{const o=document.createElement('option');o.value=String(p.index);o.textContent=`手柄 ${p.index+1} · ${p.id}`;$('pads').append(o)});
  if(selected===null&&pads.length===1)selected=pads[0].index;
  if(selected!==null)$('pads').value=String(selected);
 }
 const raw=pads.find(p=>p.index===selected);latest=snapshot(raw);
 if(latest){
  const identity=`${latest.index}:${latest.id}`;if(lost||identity!==lastIdentity){reset();lost=false;lastIdentity=identity}lastSnapshot=latest;
  const signature=JSON.stringify([latest.axes,latest.buttons]);if(lastSignature&&signature!==lastSignature)changes++;lastSignature=signature;seen=true;
  latest.buttons.forEach((b,i)=>{if(b.pressed||b.value>.5)pressed.add(i)});latest.axes.forEach((v,i)=>{ranges[i][0]=Math.min(ranges[i][0],v);ranges[i][1]=Math.max(ranges[i][1],v)});
  position=move(position,latest,dt);$('status').textContent='已连接 · 真实手柄输入';$('device').textContent=latest.id+(latest.standard?' · 标准映射':' · 非标准映射，请核对轴和按钮编号');
 }else{if(seen)lost=true;$('status').textContent=accessError?accessError:!window.isSecureContext?'请在本机文件或 localhost 打开':pads.length>1?'请选择 Sunshine 虚拟手柄':lost?'手柄已断开':'等待真实手柄';$('device').textContent='请按一下掌机 A；若有多个手柄，选择 Sunshine 创建的那一个。'}
 $('summary').textContent=`输入变化 ${changes} 次 · 已观测按钮 ${pressed.size} 个 · 逻辑自检通过`;draw(latest);requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</html>
